name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libxkbcommon-dev libfontconfig1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          NAME=vivi-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p $NAME
          cp target/release/vivi README.md LICENSE CHANGELOG.md $NAME/
          tar czf $NAME.tar.gz $NAME
          sha256sum $NAME.tar.gz > $NAME.tar.gz.sha256
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vivi-*.tar.gz* --generate-notes --title "Vivi $GITHUB_REF_NAME"
