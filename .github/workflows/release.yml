name: Release
on:
  push:
    tags: ["v*"]
  # Manual runs build every platform without publishing (for testing packaging).
  workflow_dispatch:
permissions:
  contents: write
  # The packaging job starts the Docs site workflow (a push made with GITHUB_TOKEN does not).
  actions: write
env:
  CARGO_TERM_COLOR: always

# Caches: tag runs only RESTORE. A cache saved on a tag ref is visible to that tag alone, so it
# would only pile up; caches saved on master are visible to every ref. They are saved by
# cache-warmup.yml (push to master when Cargo.lock, the Flatpak manifest etc. change), or by a
# manual run of this workflow on master. Cache keys, toolchain, env and cargo profile must stay
# in sync with cache-warmup.yml.
#
# Asset names: vivi-<X.Y.Z>-<system>[-<kind>].<ext>. Manual (non-tag) runs use
# <Cargo.toml version>-dev.<shortsha> from scripts/release-version.sh instead of the tag:
# vivi-X.Y.Z-linux-{x64,arm64}.AppImage (+ .zsync), vivi-X.Y.Z-linux-{x64,arm64}.tar.gz,
# vivi-X.Y.Z-linux-x64.flatpak, vivi-X.Y.Z-macos-arm64.zip, vivi-X.Y.Z-windows-{x64,arm64}-portable.zip,
# vivi-X.Y.Z-windows-{x64,arm64}-setup.exe and SHA256SUMS. scripts/bump-packaging.py, scripts/build-site.py and docs/site/install.sh use them.

jobs:
  linux:
    # arm64 is new: a failing arm64 build must not hold back the release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, suffix: "" }
          - { arch: arm64, runner: ubuntu-24.04-arm, suffix: "-arm64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Add swap (the fat-LTO release link of the Slint UI needs more than the runner's RAM)
        run: |
          sudo fallocate -l 10G /swapfile.vivi && sudo chmod 600 /swapfile.vivi
          sudo mkswap /swapfile.vivi && sudo swapon /swapfile.vivi
          free -h; swapon --show
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libxkbcommon-dev libfontconfig1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux${{ matrix.suffix }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
      - name: Tarball
        run: |
          V=$(scripts/release-version.sh)
          NAME=vivi-${V}-linux-${{ matrix.arch }}
          mkdir -p dist $NAME
          cp target/release/vivi target/release/vivi-mcp README.md LICENSE CHANGELOG.md packaging/vivi.desktop packaging/vivi.svg packaging/vivi.png $NAME/
          tar czf dist/$NAME.tar.gz $NAME
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # The AppImage is built on the oldest supported Ubuntu LTS (as the AppImage catalog tests it),
  # so the binary and every bundled library need at most glibc 2.35 and GLIBCXX_3.4.30. The
  # tarball and PKGBUILD stay on ubuntu-24.04 (job linux). Ubuntu 22.04's libplacebo is too old
  # for mpv, so build-libmpv.sh builds it as well (BUILD_LIBPLACEBO=1).
  appimage:
    # arm64 is new: a failing arm64 build must not hold back the release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04, suffix: "" }
          - { arch: arm64, runner: ubuntu-22.04-arm, suffix: "-arm64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Add swap (the fat-LTO release link of the Slint UI needs more than the runner's RAM)
        run: |
          sudo fallocate -l 10G /swapfile.vivi && sudo chmod 600 /swapfile.vivi
          sudo mkswap /swapfile.vivi && sudo swapon /swapfile.vivi
          free -h; swapon --show
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libgtk-3-dev libfuse2 desktop-file-utils \
            appstream file nasm ninja-build pkg-config python3-pip libass-dev libpulse-dev libasound2-dev libdrm-dev libgbm-dev \
            libva-dev libvdpau-dev libwayland-dev wayland-protocols libx11-dev libxext-dev libxrandr-dev \
            libxss-dev libxpresent-dev libxv-dev libxinerama-dev libegl-dev libgl-dev libuchardet-dev liblua5.2-dev libgnutls28-dev \
            libdav1d-dev libvpx-dev libopus-dev libvorbis-dev libwebp-dev libxml2-dev libbz2-dev liblzma-dev zlib1g-dev \
            libjpeg-dev liblcms2-dev libxkbcommon-x11-dev libxcursor-dev libxi-dev
          # mpv 0.40 needs meson >= 1.3; Ubuntu 22.04 ships 0.61.
          pip3 install --user 'meson>=1.3,<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-appimage-2204${{ matrix.suffix }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Slim libmpv (decoders only FFmpeg, no mpv CLI) and libplacebo; cached by script hash.
      - uses: actions/cache/restore@v6
        id: deps
        with:
          path: deps
          key: libmpv-ubuntu-22.04${{ matrix.suffix }}-${{ hashFiles('packaging/appimage/build-libmpv.sh') }}
      - name: Build slim libmpv
        if: steps.deps.outputs.cache-hit != 'true'
        run: BUILD_LIBPLACEBO=1 PREFIX=$PWD/deps SRC=$RUNNER_TEMP/deps-src packaging/appimage/build-libmpv.sh
      - name: Save slim libmpv (master only)
        if: github.ref == 'refs/heads/master' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
          LIBRARY_PATH: ${{ github.workspace }}/deps/lib
          # GNU ld (the arm64 linker; x64 uses rust-lld) resolves libmpv's own FFmpeg and
          # libplacebo dependencies through LD_LIBRARY_PATH, not LIBRARY_PATH.
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/lib
      - name: AppImage (bundles the slim libmpv and its libraries)
        run: |
          V=$(scripts/release-version.sh)
          A=dist/vivi-${V}-linux-${{ matrix.arch }}.AppImage
          desktop-file-validate packaging/vivi.desktop
          mkdir -p dist
          UPDATE_INFO="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|vivi-*-linux-${{ matrix.arch }}.AppImage.zsync" \
            DEPS=$PWD/deps packaging/appimage/build-appimage.sh $A
          test -s $A.zsync
          # x64 AppImages up to v0.16.4 look for "Vivi-*x86_64.AppImage.zsync" in the latest
          # release. This copy (same content; its URL points at the new AppImage) keeps their
          # in-place update working; drop it once those versions are gone.
          if [ ${{ matrix.arch }} = x64 ]; then cp $A.zsync dist/Vivi-update-x86_64.AppImage.zsync; fi
          ls -la dist
          # Smoke test: the extracted image must resolve every library, carry a PNG .DirIcon,
          # valid AppStream metadata, update information and no symbol newer than Ubuntu 22.04.
          ./$A --appimage-extract >/dev/null
          ! LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/vivi | grep "not found"
          file -L squashfs-root/.DirIcon | grep -q 'PNG image data'
          appstreamcli validate --no-net --explain squashfs-root/usr/share/metainfo/*.appdata.xml || echo "::warning::appstreamcli reported issues"
          ./$A --appimage-updateinformation | grep -q '^gh-releases-zsync|.*|vivi-\*-linux-${{ matrix.arch }}.AppImage.zsync$'
          grep -q "^URL: vivi-${V}-linux-${{ matrix.arch }}.AppImage$" $A.zsync
          packaging/appimage/check-abi.sh squashfs-root
          rm -rf squashfs-root
      - name: AppImage starts on a bare Ubuntu 22.04 under Xvfb (as the AppImage catalog tests it)
        timeout-minutes: 10
        run: |
          V=$(scripts/release-version.sh)
          # Only what every desktop has plus the libraries the AppImage leaves to
          # the host (excludelist, Wayland, D-Bus, sound, libdrm); anything vivi
          # loads at run time beyond that must come from the image itself.
          timeout 480 docker run --rm --init -v "$PWD/dist:/dist:ro" ubuntu:22.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb xauth xdotool libgl1 libegl1 libx11-6 libx11-xcb1 libxcb1 \
              libxext6 libxrender1 libfontconfig1 libfreetype6 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
              libdbus-1-3 libpulse0 libasound2 libdrm2 libharfbuzz0b libfribidi0 libexpat1 >/dev/null
            T=$(mktemp -d); mkdir -p $T/run; chmod 700 $T/run
            cp /dist/vivi-'"$V"'-linux-${{ matrix.arch }}.AppImage $T/vivi.AppImage
            cd $T
            # Every linked library must resolve from the image or this host set.
            ./vivi.AppImage --appimage-extract >/dev/null
            missing=$(for f in squashfs-root/usr/bin/vivi squashfs-root/usr/lib/*.so*; do LD_LIBRARY_PATH=squashfs-root/usr/lib ldd "$f" | grep "not found" || true; done | sort -u)
            [ -z "$missing" ] || { echo "missing on a bare system:"; echo "$missing"; exit 1; }
            rm -rf squashfs-root
            HOME=$T XDG_CONFIG_HOME=$T/cfg XDG_DATA_HOME=$T/data XDG_CACHE_HOME=$T/cache XDG_STATE_HOME=$T/state \
              XDG_RUNTIME_DIR=$T/run VIVI_SOCKET=$T/run/vivi.sock VIVI_NO_TRAY=1 APPIMAGE_EXTRACT_AND_RUN=1 \
              timeout 120 xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
                timeout -s KILL 60 ./vivi.AppImage > vivi.log 2>&1 & P=\$!
                for i in \$(seq 1 30); do kill -0 \$P 2>/dev/null || break; timeout 5 xdotool search --onlyvisible --name . >/dev/null 2>&1 && break; sleep 1; done
                ok=0; kill -0 \$P 2>/dev/null && timeout 5 xdotool search --onlyvisible --name . >/dev/null 2>&1 && ok=1
                kill -9 \$P 2>/dev/null || true
                cat vivi.log
                [ \$ok = 1 ] || { echo no window; exit 1; }
                echo window shown"
          '
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*

  windows:
    # arm64 is new: a failing arm64 build must not hold back the release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: libmpv (shinchiro/mpv-winbuild-cmake) and MSVC import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging\windows\fetch-libmpv.ps1 -Arch ${{ matrix.arch }}
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
      - name: Portable zip
        shell: pwsh
        run: |
          $ver = (bash scripts/release-version.sh).Trim()
          $name = "vivi-$ver-windows-${{ matrix.arch }}-portable"
          New-Item -ItemType Directory -Force $name, dist | Out-Null
          Copy-Item target\release\vivi.exe, mpv\libmpv-2.dll, README.md, LICENSE, CHANGELOG.md $name
          # 7-Zip's maximum Deflate is ~4 MB smaller than Compress-Archive and still a plain zip.
          7z a -tzip -mx=9 -mfb=258 "dist\$name.zip" $name | Out-Null
      - name: Installer (Inno Setup, per-user)
        shell: pwsh
        run: |
          $ver = (bash scripts/release-version.sh).Trim()
          packaging\windows\build-installer.ps1 -Exe target\release\vivi.exe -Mpv mpv\libmpv-2.dll -Version $ver -Arch ${{ matrix.arch }} -OutDir dist
      - name: vivi --version answers
        shell: pwsh
        run: |
          Copy-Item mpv\libmpv-2.dll target\release\
          $out = & target\release\vivi.exe --version | Out-String
          Write-Host "exit code: $LASTEXITCODE"
          Write-Host $out
          if ($out -notmatch '^vivi \d') { throw "vivi --version printed nothing" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    runs-on: macos-15
    continue-on-error: true # best effort
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: brew install mpv dylibbundler librsvg
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
          LIBRARY_PATH: /opt/homebrew/lib
      - name: Vivi.app
        run: |
          V=$(scripts/release-version.sh)
          NUM=${V%%-*}
          APP=Vivi.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources $APP/Contents/Frameworks dist
          cp target/release/vivi $APP/Contents/MacOS/vivi
          mkdir vivi.iconset
          for s in 16 32 64 128 256 512; do
            rsvg-convert -w $s -h $s packaging/vivi.svg -o vivi.iconset/icon_${s}x${s}.png
            rsvg-convert -w $((s*2)) -h $((s*2)) packaging/vivi.svg -o vivi.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns vivi.iconset -o $APP/Contents/Resources/vivi.icns
          cat > $APP/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Vivi</string>
            <key>CFBundleDisplayName</key><string>Vivi</string>
            <key>CFBundleIdentifier</key><string>io.github.loafer19.vivi</string>
            <key>CFBundleVersion</key><string>${NUM}</string>
            <key>CFBundleShortVersionString</key><string>${V}</string>
            <key>CFBundleExecutable</key><string>vivi</string>
            <key>CFBundleIconFile</key><string>vivi</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' $APP/Contents/Info.plist
          dylibbundler -od -b -x $APP/Contents/MacOS/vivi -d $APP/Contents/Frameworks -p @executable_path/../Frameworks/
          codesign --force --deep -s - $APP
          ditto -c -k --keepParent $APP dist/vivi-${V}-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: dist/* }

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
      # Updating a runtime renames its old deployment, which fails with "Invalid cross-device
      # link" when /var/lib/flatpak sits in a Docker image layer (overlayfs). A volume is not.
      volumes:
        - /var/lib/flatpak
    steps:
      - uses: actions/checkout@v7
      # flatpak-builder's state dir (built dependency modules, git mirrors, downloads). Restored
      # before the next step edits the manifest, so the key hashes the committed manifest.
      - name: Restore flatpak-builder state
        id: fb-cache
        uses: actions/cache/restore@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ runner.arch }}-x86_64-${{ hashFiles('packaging/flatpak/io.github.loafer19.vivi.yml') }}
          restore-keys: flatpak-builder-${{ runner.os }}-${{ runner.arch }}-x86_64-
      - name: Add swap (the fat-LTO release link of the Slint UI needs more than the runner's RAM)
        run: |
          # The flatpak-builder image has no mkswap/swapon and no package manager: warn and go on.
          if ! command -v mkswap >/dev/null || ! command -v swapon >/dev/null; then
            echo "::warning::no mkswap/swapon in this image; building without extra swap"; free -h; exit 0
          fi
          f="$GITHUB_WORKSPACE/../swapfile"
          fallocate -l 10G "$f" && chmod 600 "$f" && mkswap "$f" && swapon "$f"
          free -h; swapon --show
      # Inject the public Jamendo client id and AcoustID application key into the build env at CI time only (not committed).
      - name: Jamendo client id and AcoustID key for the Flatpak build
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
        run: |
          M=packaging/flatpak/io.github.loafer19.vivi.yml
          for k in VIVI_JAMENDO_CLIENT_ID VIVI_ACOUSTID_KEY; do
            v="${!k}"
            [ -n "$v" ] || continue
            sed -i "s|^\( *\)CARGO_HOME: /run/build/vivi/cargo$|&\n\1$k: '$v'|" "$M"
            grep -c "$k" "$M"
          done
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: vivi.flatpak
          manifest-path: packaging/flatpak/io.github.loafer19.vivi.yml
          # The action's own cache saves on every ref (and its fallback key never matches):
          # off, the explicit restore/save steps around it apply the master-only policy.
          cache: false
          restore-cache: false
          upload-artifact: false
      - name: Save flatpak-builder state (master only)
        if: github.ref == 'refs/heads/master' && steps.fb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .flatpak-builder
          key: ${{ steps.fb-cache.outputs.cache-primary-key }}
      - name: Name the bundle
        run: |
          V=$(scripts/release-version.sh)
          mkdir -p dist && mv vivi.flatpak dist/vivi-${V}-linux-x64.flatpak
      - uses: actions/upload-artifact@v7
        with: { name: flatpak, path: dist/* }

  publish:
    needs: [linux, appimage, windows, macos, flatpak]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' && needs.appimage.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          VER=${GITHUB_REF_NAME#v}
          awk -v v="$VER" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > notes.md
          test -s notes.md
          T=${GITHUB_REF_NAME}
          V=${T#v}
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${T}"
          # Release image from the repo at this tag (no screenshot asset is uploaded):
          # docs/screenshots/release.png when the release has its own, else the Home screenshot.
          IMG=docs/screenshots/library-home.png
          [ -f docs/screenshots/release.png ] && IMG=docs/screenshots/release.png
          has() { [ -f "dist/$1" ]; }
          link() { has "$2" && printf '[%s](%s/%s)' "$1" "$DL" "$2"; }
          join() { local out="" x; for x in "$@"; do [ -n "$x" ] && out="${out:+$out · }$x"; done; echo "${out:-—}"; }
          {
            echo
            echo "![Vivi](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${T}/${IMG})"
            echo
            echo "Demo media: Blender Foundation and CC-licensed artists (CC BY)"
            echo
            echo "### Downloads"
            echo "| System | Recommended | Other |"
            echo "|---|---|---|"
            for A in x64 arm64; do
              if has "vivi-${V}-windows-${A}-setup.exe" || has "vivi-${V}-windows-${A}-portable.zip"; then
                L="Windows 10/11 x64"; [ $A = arm64 ] && L="Windows 11 on Arm (arm64)"
                echo "| $L | $(join "$(link Installer "vivi-${V}-windows-${A}-setup.exe")") | $(join "$(link 'Portable zip' "vivi-${V}-windows-${A}-portable.zip")") |"
              fi
            done
            AUR="[Arch PKGBUILD](https://github.com/${GITHUB_REPOSITORY}/tree/master/packaging/aur/vivi-bin)"
            SCRIPT="[install script](https://viviplayer.app/#install)"
            echo "| Linux x64 | $(join "$(link AppImage "vivi-${V}-linux-x64.AppImage")") | $(join "$(link Flatpak "vivi-${V}-linux-x64.flatpak")" "$(link 'tar.gz (needs mpv)' "vivi-${V}-linux-x64.tar.gz")" "$AUR" "$SCRIPT") |"
            if has "vivi-${V}-linux-arm64.AppImage" || has "vivi-${V}-linux-arm64.tar.gz"; then
              echo "| Linux arm64 | $(join "$(link AppImage "vivi-${V}-linux-arm64.AppImage")") | $(join "$(link 'tar.gz (needs mpv)' "vivi-${V}-linux-arm64.tar.gz")" "$SCRIPT") |"
            fi
            if has "vivi-${V}-macos-arm64.zip"; then
              echo "| macOS Apple Silicon (experimental) | $(link 'App zip' "vivi-${V}-macos-arm64.zip") | — |"
            fi
            echo
            echo "Checksums: [SHA256SUMS](${DL}/SHA256SUMS)."
          } >> notes.md
          cat notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --generate-notes --title "Vivi $GITHUB_REF_NAME"

  # Bumps packaging/aur (vivi-bin, vivi-git), packaging/flathub, packaging/winget and
  # packaging/scoop to the new version and checksums and commits that to master. Nothing is
  # published to AUR, Flathub, winget or Scoop: see packaging/aur/README.md and
  # packaging/flathub/README.md for the manual steps.
  packaging:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: master, fetch-depth: 0 }
      - name: Bump packaging to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D "$RUNNER_TEMP/rel"
          # Flatpak metainfo and cargo sources as of the tag (master may have moved on).
          git show "$GITHUB_SHA:packaging/flatpak/cargo-sources.json" > "$RUNNER_TEMP/cargo-sources.json"
          git show "$GITHUB_SHA:packaging/flatpak/io.github.loafer19.vivi.metainfo.xml" > "$RUNNER_TEMP/meta.xml"
          META_SRC="$RUNNER_TEMP/meta.xml" CARGO_SOURCES="$RUNNER_TEMP/cargo-sources.json" \
            python3 scripts/bump-packaging.py "$VER" "$RUNNER_TEMP/rel" "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging
          git diff --cached --quiet && exit 0
          git commit -m "Packaging: AUR, Flathub, winget and Scoop manifests for $GITHUB_REF_NAME"
          git push origin HEAD:master
      # The site's download links follow the latest release (scripts/build-site.py reads its
      # assets); a push made with GITHUB_TOKEN does not start the Pages workflow by itself.
      - name: Rebuild the site for the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master -R "$GITHUB_REPOSITORY"
