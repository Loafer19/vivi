name: Release
on:
  push:
    tags: ["v*"]
  # Manual runs build every platform without publishing (for testing packaging).
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Add swap (the fat-LTO release link of the Slint UI needs more than the runner's RAM)
        run: |
          sudo fallocate -l 10G /swapfile.vivi && sudo chmod 600 /swapfile.vivi
          sudo mkswap /swapfile.vivi && sudo swapon /swapfile.vivi
          free -h; swapon --show
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libxkbcommon-dev libfontconfig1-dev libgtk-3-dev libsqlite3-dev libfuse2t64 desktop-file-utils \
            nasm meson ninja-build pkg-config libass-dev libplacebo-dev libpulse-dev libasound2-dev libdrm-dev libgbm-dev \
            libva-dev libvdpau-dev libvulkan-dev libwayland-dev wayland-protocols libx11-dev libxext-dev libxrandr-dev \
            libxss-dev libxpresent-dev libxv-dev libxinerama-dev libegl-dev libuchardet-dev liblua5.2-dev libgnutls28-dev \
            libdav1d-dev libvpx-dev libopus-dev libvorbis-dev libwebp-dev libxml2-dev libbz2-dev liblzma-dev zlib1g-dev \
            libjpeg-dev liblcms2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Slim libmpv (decoders only FFmpeg, no mpv CLI) for the AppImage; cached by script hash.
      - uses: actions/cache@v5
        id: deps
        with:
          path: deps
          key: libmpv-${{ runner.os }}-${{ hashFiles('packaging/appimage/build-libmpv.sh') }}
      - name: Build slim libmpv
        if: steps.deps.outputs.cache-hit != 'true'
        run: PREFIX=$PWD/deps SRC=$RUNNER_TEMP/deps-src packaging/appimage/build-libmpv.sh
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
          PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
          LIBRARY_PATH: ${{ github.workspace }}/deps/lib
      - name: Tarball
        run: |
          VER=${GITHUB_REF_NAME}; [[ $VER == v* ]] || VER=dev
          NAME=vivi-${VER}-linux-x86_64
          mkdir -p dist $NAME
          cp target/release/vivi target/release/vivi-mcp README.md LICENSE CHANGELOG.md packaging/vivi.desktop packaging/vivi.svg packaging/vivi.png $NAME/
          tar czf dist/$NAME.tar.gz $NAME
      - name: AppImage (bundles the slim libmpv and its libraries)
        run: |
          VER=${GITHUB_REF_NAME}; [[ $VER == v* ]] || VER=dev
          desktop-file-validate packaging/vivi.desktop
          DEPS=$PWD/deps packaging/appimage/build-appimage.sh dist/Vivi-${VER}-x86_64.AppImage
          ls -la dist
          # Smoke test: the extracted image must resolve every library.
          ./dist/Vivi-${VER}-x86_64.AppImage --appimage-extract >/dev/null
          ! LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/vivi | grep "not found"
      - name: PKGBUILD (vivi-bin) with checksum
        run: |
          VER=${GITHUB_REF_NAME#v}; [[ $GITHUB_REF_NAME == v* ]] || VER=0.0.0
          SUM=$(sha256sum dist/vivi-*-linux-x86_64.tar.gz | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=${VER}/" -e "s/^sha256sums=.*/sha256sums=('${SUM}')/" packaging/arch/vivi-bin/PKGBUILD > dist/PKGBUILD
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: libmpv (shinchiro/mpv-winbuild-cmake) and MSVC import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-2*' -O mpv-dev.7z
          7z x mpv-dev.7z -ompv | Out-Null
          Get-ChildItem mpv
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64" | Select-Object -Last 1).FullName
          $dll = (Get-ChildItem mpv\libmpv-2.dll).FullName
          if (-not (Test-Path mpv\mpv.def)) {
            $names = & "$bin\dumpbin.exe" /exports $dll | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] } }
            (@('EXPORTS') + $names) | Set-Content mpv\mpv.def
          }
          & "$bin\lib.exe" /def:mpv\mpv.def /name:libmpv-2.dll /machine:x64 /out:mpv\mpv.lib
          "RUSTFLAGS=-L native=$((Resolve-Path mpv).Path)" | Out-File -Append $env:GITHUB_ENV
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
      - name: Zip
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $name = "vivi-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force $name, dist | Out-Null
          Copy-Item target\release\vivi.exe, mpv\libmpv-2.dll, README.md, LICENSE, CHANGELOG.md $name
          # 7-Zip's maximum Deflate is ~4 MB smaller than Compress-Archive and still a plain zip.
          7z a -tzip -mx=9 -mfb=258 "dist\$name.zip" $name | Out-Null
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-14
    continue-on-error: true # best effort
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install mpv dylibbundler librsvg
      - run: cargo build --release
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
          LIBRARY_PATH: /opt/homebrew/lib
      - name: Vivi.app
        run: |
          VER=${GITHUB_REF_NAME}; [[ $VER == v* ]] || VER=dev
          APP=Vivi.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources $APP/Contents/Frameworks dist
          cp target/release/vivi $APP/Contents/MacOS/vivi
          mkdir vivi.iconset
          for s in 16 32 64 128 256 512; do
            rsvg-convert -w $s -h $s packaging/vivi.svg -o vivi.iconset/icon_${s}x${s}.png
            rsvg-convert -w $((s*2)) -h $((s*2)) packaging/vivi.svg -o vivi.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns vivi.iconset -o $APP/Contents/Resources/vivi.icns
          cat > $APP/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Vivi</string>
            <key>CFBundleDisplayName</key><string>Vivi</string>
            <key>CFBundleIdentifier</key><string>io.github.loafer19.vivi</string>
            <key>CFBundleVersion</key><string>${VER#v}</string>
            <key>CFBundleShortVersionString</key><string>${VER#v}</string>
            <key>CFBundleExecutable</key><string>vivi</string>
            <key>CFBundleIconFile</key><string>vivi</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' $APP/Contents/Info.plist
          dylibbundler -od -b -x $APP/Contents/MacOS/vivi -d $APP/Contents/Frameworks -p @executable_path/../Frameworks/
          codesign --force --deep -s - $APP
          ditto -c -k --keepParent $APP dist/vivi-${VER}-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: dist/* }

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Add swap (the fat-LTO release link of the Slint UI needs more than the runner's RAM)
        run: |
          f="$GITHUB_WORKSPACE/../swapfile"
          fallocate -l 10G "$f" && chmod 600 "$f" && mkswap "$f" && swapon "$f"
          free -h; swapon --show
      # Inject the public Jamendo client id and AcoustID application key into the build env at CI time only (not committed).
      - name: Jamendo client id and AcoustID key for the Flatpak build
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
        run: |
          M=packaging/flatpak/io.github.loafer19.vivi.yml
          for k in VIVI_JAMENDO_CLIENT_ID VIVI_ACOUSTID_KEY; do
            v="${!k}"
            [ -n "$v" ] || continue
            sed -i "s|^\( *\)CARGO_HOME: /run/build/vivi/cargo$|&\n\1$k: '$v'|" "$M"
            grep -c "$k" "$M"
          done
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: vivi.flatpak
          manifest-path: packaging/flatpak/io.github.loafer19.vivi.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Name the bundle
        run: |
          VER=${GITHUB_REF_NAME}; [[ $VER == v* ]] || VER=dev
          mkdir -p dist && mv vivi.flatpak dist/vivi-${VER}-x86_64.flatpak
      - uses: actions/upload-artifact@v7
        with: { name: flatpak, path: dist/* }

  publish:
    needs: [linux, windows, macos, flatpak]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          VER=${GITHUB_REF_NAME#v}
          awk -v v="$VER" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md > notes.md
          test -s notes.md
          T=${GITHUB_REF_NAME}
          {
            echo
            echo "![Vivi](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${T}/docs/screenshots/library-home.png)"
            echo
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Linux (any distro) | \`Vivi-${T}-x86_64.AppImage\`: \`chmod +x\` and run. libmpv is bundled. |"
            echo "| Linux tarball | \`vivi-${T}-linux-x86_64.tar.gz\`: needs mpv and sqlite installed. |"
            echo "| Arch / Omarchy | \`PKGBUILD\` (vivi-bin): \`makepkg -si\` in a folder with it. |"
            [ -n "$(ls dist/*.flatpak 2>/dev/null)" ] && echo "| Linux Flatpak | \`vivi-${T}-x86_64.flatpak\`: \`flatpak install --user vivi-${T}-x86_64.flatpak\` (needs the Flathub remote for the runtime). |"
            [ -n "$(ls dist/*windows* 2>/dev/null)" ] && echo "| Windows x64 | \`vivi-${T}-windows-x86_64.zip\`: unzip and run \`vivi.exe\` (libmpv-2.dll included). |"
            [ -n "$(ls dist/*macos* 2>/dev/null)" ] && echo "| macOS (Apple Silicon, experimental) | \`vivi-${T}-macos-arm64.zip\`: unsigned; right-click → Open the first time. |"
            echo
            echo "Checksums: \`SHA256SUMS\`."
          } >> notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --generate-notes --title "Vivi $GITHUB_REF_NAME"

  # Bumps packaging/aur (vivi-bin, vivi-git), packaging/flathub, packaging/winget and
  # packaging/scoop to the new version and checksums and commits that to master. Nothing is
  # published to AUR, Flathub, winget or Scoop: see packaging/aur/README.md and
  # packaging/flathub/README.md for the manual steps.
  packaging:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: master, fetch-depth: 0 }
      - name: Bump packaging to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D "$RUNNER_TEMP/rel"
          # Flatpak metainfo and cargo sources as of the tag (master may have moved on).
          git show "$GITHUB_SHA:packaging/flatpak/cargo-sources.json" > "$RUNNER_TEMP/cargo-sources.json"
          git show "$GITHUB_SHA:packaging/flatpak/io.github.loafer19.vivi.metainfo.xml" > "$RUNNER_TEMP/meta.xml"
          META_SRC="$RUNNER_TEMP/meta.xml" CARGO_SOURCES="$RUNNER_TEMP/cargo-sources.json" \
            python3 scripts/bump-packaging.py "$VER" "$RUNNER_TEMP/rel" "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging
          git diff --cached --quiet && exit 0
          git commit -m "Packaging: AUR, Flathub, winget and Scoop manifests for $GITHUB_REF_NAME"
          git push origin HEAD:master
