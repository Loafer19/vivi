name: CI
on:
  push:
    branches: [master]
  pull_request:
  # Manual runs on any branch (e.g. a feature branch before its pull request).
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libxkbcommon-dev libfontconfig1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `ci` profile: release opt-level without fat LTO (see Cargo.toml); releases keep fat LTO.
      - run: cargo build --profile ci
        env:
          VIVI_JAMENDO_CLIENT_ID: ${{ vars.VIVI_JAMENDO_CLIENT_ID }}
          VIVI_ACOUSTID_KEY: ${{ vars.VIVI_ACOUSTID_KEY }}
      # One job at a time: the test build of the big UI crate ran the hosted runner out of memory.
      - run: cargo test --profile ci -j 1
  # Advisories (RUSTSEC), licenses, banned/duplicate crates and sources; see deny.toml.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
  # Unit tests on the other desktop platforms (Linux runs them in `build`). No clippy
  # -D warnings here: the Windows/macOS builds have known dead_code warnings.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
          cache-on-failure: true
      - name: libmpv (shinchiro/mpv-winbuild-cmake) and MSVC import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The test binaries load libmpv-2.dll at start-up (-AddToPath).
        run: packaging\windows\fetch-libmpv.ps1 -Arch x64 -AddToPath
      - run: cargo test
  # Windows packages as the release builds them (portable zip + Inno Setup installer), x64 and
  # arm64, with the `ci` profile (no fat LTO). Artifacts: windows-ci-<arch>.
  package-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-package-${{ matrix.arch }}
          cache-on-failure: true
      - name: libmpv (shinchiro/mpv-winbuild-cmake) and MSVC import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging\windows\fetch-libmpv.ps1 -Arch ${{ matrix.arch }}
      - run: cargo build --profile ci
      - name: vivi --version answers (console attach)
        shell: pwsh
        run: |
          $out = & target\ci\vivi.exe --version | Out-String
          Write-Host $out
          if ($out -notmatch '^vivi \d') { throw "vivi --version printed nothing" }
      - name: Portable zip and installer
        shell: pwsh
        run: |
          $name = "vivi-dev-windows-${{ matrix.arch }}-portable"
          New-Item -ItemType Directory -Force $name, dist | Out-Null
          Copy-Item target\ci\vivi.exe, mpv\libmpv-2.dll, README.md, LICENSE, CHANGELOG.md $name
          7z a -tzip -mx=5 "dist\$name.zip" $name | Out-Null
          packaging\windows\build-installer.ps1 -Exe target\ci\vivi.exe -Mpv mpv\libmpv-2.dll -Version dev -Arch ${{ matrix.arch }} -OutDir dist
      - name: Installer installs, registers and uninstalls silently
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Vivi"
          foreach ($f in 'vivi.exe', 'libmpv-2.dll', 'vivi.ico', 'unins000.exe') { if (-not (Test-Path "$app\$f")) { Get-Content install.log; throw "$f missing" } }
          Get-ChildItem $app | Format-Table Name, Length
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Vivi.lnk"
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut missing" }
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { $_.GetValue('DisplayName') -eq 'Vivi' }
          if (-not $key) { throw "uninstaller not registered" }
          $v = & "$app\vivi.exe" --version | Out-String
          if ($v -notmatch '^vivi \d') { throw "installed vivi --version printed nothing" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep 3
          if (Test-Path "$app\vivi.exe") { throw "uninstall left vivi.exe" }
          if (Test-Path $lnk) { throw "uninstall left the shortcut" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-ci-${{ matrix.arch }}
          path: dist/*
  test-macos:
    runs-on: macos-15
    # A cold build of the test binary takes over 20 minutes here; no hang.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
          cache-on-failure: true
      - run: brew install mpv
      - run: cargo test
        env:
          LIBRARY_PATH: /opt/homebrew/lib
          # No debug info: a much faster compile and link on the macOS runner.
          CARGO_PROFILE_DEV_DEBUG: "0"
  flatpak-sources:
    # Fails when packaging/flatpak/cargo-sources.json no longer matches Cargo.lock.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate cargo-sources.json
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q aiohttp toml tomlkit PyYAML
          curl -fsSL -o /tmp/fcg.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          /tmp/venv/bin/python /tmp/fcg.py Cargo.lock -o /tmp/cargo-sources.json
      - name: Compare
        run: |
          if ! diff -q <(jq -S . packaging/flatpak/cargo-sources.json) <(jq -S . /tmp/cargo-sources.json); then
            echo "::error file=packaging/flatpak/cargo-sources.json::stale; run: python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json"
            exit 1
          fi
