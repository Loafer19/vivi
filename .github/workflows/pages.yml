name: Docs site
# Builds docs/site and deploys it to GitHub Pages (mirror of viviplayer.app).
# Pages must be enabled in Settings → Pages with "GitHub Actions" as the source; for a
# private repository that needs a paid plan (or a public repository).
on:
  push:
    branches: [master]
    paths: ["docs/site/**", "scripts/build-site.py", "docs/screenshots/**", "packaging/aur/vivi-bin/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build-site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
