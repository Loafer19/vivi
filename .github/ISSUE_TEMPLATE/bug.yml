name: Bug report
description: Something doesn't work
labels: ["type: bug"]
body:
  - type: textarea
    attributes: { label: What happened, description: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    attributes: { label: Expected behavior }
  - type: input
    attributes: { label: System, placeholder: "Arch/Omarchy, Hyprland (Wayland), GPU" }
  - type: textarea
    attributes: { label: Log, description: "Run with VIVI_MPV_DEBUG=1", render: text }
