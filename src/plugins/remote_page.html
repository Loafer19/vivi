<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Vivi Remote</title>
<style>
:root{color-scheme:dark;--a:#4cc2ff}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#111;color:#eee;padding:16px;max-width:520px;margin:auto}
#art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#222;display:block}
h1{font-size:20px;margin:14px 0 2px}#artist{color:#aaa;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0}
button{background:#2a2a2a;color:#eee;border:0;border-radius:50%;width:64px;height:64px;font-size:24px}
button.big{width:80px;height:80px;background:var(--a);color:#111;font-size:30px}
input[type=range]{width:100%;accent-color:var(--a)}
.t{display:flex;justify-content:space-between;color:#aaa;font-size:13px}
ol{padding:0;list-style:none}li{padding:10px;border-radius:8px;background:#1b1b1b;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.cur{background:#233544;color:var(--a)}
#pin{display:none;text-align:center;margin-top:30vh}#pin input{font-size:28px;width:8em;text-align:center;padding:8px;border-radius:8px;border:0}
#err{color:#f77;text-align:center}
</style></head><body>
<div id="pin"><p>Enter the PIN shown in Vivi → Settings → Extensions → Remote Control</p>
<input id="p" inputmode="numeric" autocomplete="one-time-code"><p><button class="big" onclick="savePin()">OK</button></p></div>
<div id="ui" style="display:none">
<img id="art" alt="">
<h1 id="title">—</h1><p id="artist"></p>
<input id="seek" type="range" min="0" max="1000" value="0">
<div class="t"><span id="pos">0:00</span><span id="dur">0:00</span></div>
<div class="row">
<button onclick="cmd('prev')" aria-label="Previous">⏮</button>
<button onclick="cmd('seek-rel',-10)" aria-label="Back 10 s">↺</button>
<button class="big" id="pp" onclick="cmd('pause')" aria-label="Play or pause">⏯</button>
<button onclick="cmd('seek-rel',10)" aria-label="Forward 10 s">↻</button>
<button onclick="cmd('next')" aria-label="Next">⏭</button>
</div>
<div class="row"><span>🔈</span><input id="vol" type="range" min="0" max="130" value="100"><span id="vv">100</span></div>
<h1>Queue</h1><ol id="q"></ol>
</div>
<p id="err"></p>
<script>
let pin=localStorage.getItem('vivi-pin')||'',st=null,dragging=false,artKey='';
const $=id=>document.getElementById(id);
function fmt(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`}
function askPin(){$('ui').style.display='none';$('pin').style.display='block'}
function savePin(){pin=$('p').value.trim();localStorage.setItem('vivi-pin',pin);$('pin').style.display='none';poll()}
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Vivi-Pin':pin,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status==401||r.status==403){askPin();throw new Error('PIN')}
  if(r.status==429){$('err').textContent='Too many wrong PINs, wait a minute';throw new Error('429')}
  if(!r.ok)throw new Error(r.status);return r.headers.get('content-type')?.includes('json')?r.json():null}
async function cmd(c,v){try{await api('/api/cmd',{cmd:c,value:v??0});setTimeout(poll,150)}catch(e){}}
function render(s){
  $('ui').style.display='block';$('err').textContent='';
  $('title').textContent=s.title||'Nothing playing';$('artist').textContent=s.artist||'';
  $('pp').textContent=s.paused?'▶':'⏸';
  if(!dragging){$('seek').value=s.duration>0?s.position/s.duration*1000:0}
  $('pos').textContent=fmt(s.position);$('dur').textContent=fmt(s.duration);
  $('vol').max=s.volume_max||100;if(document.activeElement!==$('vol'))$('vol').value=s.volume;$('vv').textContent=Math.round(s.volume);
  const k=s.path+'';if(k!==artKey){artKey=k;$('art').src=s.has_art?'/api/art?pin='+encodeURIComponent(pin)+'&k='+encodeURIComponent(k):'data:,'}
  const q=$('q');q.innerHTML='';s.queue.forEach((t,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+t;if(i===s.current)li.className='cur';li.onclick=()=>cmd('play-index',i);q.appendChild(li)})}
async function poll(){if(!pin){askPin();return}try{st=await api('/api/state');render(st)}catch(e){if(e.message!=='PIN'&&e.message!=='429')$('err').textContent='Vivi is not reachable'}}
$('seek').oninput=()=>{dragging=true;if(st)$('pos').textContent=fmt($('seek').value/1000*st.duration)};
$('seek').onchange=()=>{dragging=false;if(st)cmd('seek',$('seek').value/1000*st.duration)};
$('vol').onchange=()=>cmd('volume',+$('vol').value);
$('p').onkeydown=e=>{if(e.key==='Enter')savePin()};
poll();setInterval(poll,1000);
</script></body></html>
