id = "sponsorblock"
name = "SponsorBlock"
version = "1.1.0"
description = "Skips sponsor, intro, self-promotion and other segments in YouTube videos opened as streams, using the crowd-sourced SponsorBlock database. Segments are marked as chapters on the seek bar; every skip shows a notice and can be undone (Alt+Shift+K). Also works for videos the YouTube plugin adds or downloads."
author = "Vivi"
kind = "mpv-lua"
entry = "sponsorblock.lua"
min_vivi = "0.9.0"
icon = "skip"
lucide = "badge-dollar-sign"
permissions = ["network", "subprocess"]
issue = 73
default_enabled = true

[[settings]]
key = "categories"
title = "Categories (space separated: sponsor selfpromo interaction intro outro preview music_offtopic filler)"
type = "text"
default = "sponsor selfpromo interaction"

[[settings]]
key = "mode"
title = "When a segment starts"
type = "choice"
options = ["Skip automatically", "Ask (Alt+K skips)"]
default = "Skip automatically"

[[settings]]
key = "chapters"
title = "Mark segments as chapters"
type = "toggle"
default = "true"

[[settings]]
key = "api"
title = "API server"
type = "text"
default = "https://sponsor.ajay.app"

[[settings]]
key = "notice"
title = "Show a notice with undo (Alt+Shift+K) after each skip"
type = "toggle"
default = "true"

[[settings]]
key = "local"
title = "Also for downloaded files named \"… [video id].ext\""
type = "toggle"
default = "true"

[[settings]]
key = "undo"
title = "Undo the last skip (Alt+Shift+K)"
type = "action"
label = "Undo"
