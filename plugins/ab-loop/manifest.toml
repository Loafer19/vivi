id = "ab-loop"
name = "A-B Loop & Frame Step"
version = "1.0.0"
description = "Set and clear A-B loop points from the keyboard, nudge them by a frame, step frame by frame while paused and see the loop on an on-screen bar."
author = "Vivi"
kind = "mpv-lua"
entry = "ab-loop.lua"
min_vivi = "0.8.0"
icon = "loop"
lucide = "repeat"
permissions = []
issue = 59

[[settings]]
key = "markers"
title = "Show loop bar"
type = "toggle"
default = "true"

[[settings]]
key = "osd-seconds"
title = "Show bar for (seconds)"
type = "choice"
options = ["3", "1", "5", "10"]
default = "3"

[[settings]]
key = "clear"
title = "Clear loop"
type = "action"
