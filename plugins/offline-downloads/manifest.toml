id = "offline-downloads"
name = "Offline Downloads"
version = "1.0.0"
description = "A download queue for offline listening and watching: YouTube and other yt-dlp sites, direct music files (Jamendo, Internet Archive and any audio/video link) and radio streams recorded for a set time. Pending / active / paused / done / failed list with pause, cancel and retry, progress and a download folder. Paste a URL or press Alt+D with one in the clipboard. Downloads no tools of its own: it uses curl and your yt-dlp, or the copy the YouTube & yt-dlp plugin manages."
author = "Vivi"
kind = "mpv-lua"
entry = "offline-downloads.lua"
min_vivi = "0.9.1"
icon = "streams"
lucide = "download"
permissions = ["network", "filesystem", "subprocess"]
size_note = "uses yt-dlp if present"
default_enabled = true

[[settings]]
key = "url"
title = "URL to download (Alt+D adds the one in the clipboard)"
type = "text"
default = ""

[[settings]]
key = "add"
title = "Add the URL to the queue"
type = "action"
label = "Add"

[[settings]]
key = "add-current"
title = "Add the playing online item"
type = "action"
label = "Add current"

[[settings]]
key = "show"
title = "Show the queue (Alt+Shift+D)"
type = "action"
label = "Show"

[[settings]]
key = "pause"
title = "Pause the active download / resume paused ones"
type = "action"
label = "Pause / Resume"

[[settings]]
key = "cancel"
title = "Cancel the active download (or remove waiting ones)"
type = "action"
label = "Cancel"

[[settings]]
key = "retry"
title = "Retry failed downloads"
type = "action"
label = "Retry"

[[settings]]
key = "clear-done"
title = "Remove finished downloads from the list (files are kept)"
type = "action"
label = "Clear"

[[settings]]
key = "folder"
title = "Download folder (empty: Downloads/Vivi)"
type = "text"
default = ""

[[settings]]
key = "pick-folder"
title = "Choose the download folder"
type = "action"
label = "Choose…"

[[settings]]
key = "open-folder"
title = "Open the download folder"
type = "action"
label = "Open"

[[settings]]
key = "video-quality"
title = "yt-dlp quality (merging video + audio needs ffmpeg; without it single files are used)"
type = "choice"
options = ["Best single file", "Best", "1080p", "720p", "480p", "Audio only"]
default = "Best single file"

[[settings]]
key = "radio-minutes"
title = "Radio / live stream recording length (minutes)"
type = "choice"
options = ["30", "10", "60", "120", "240"]
default = "30"

[[settings]]
key = "info"
title = "Which yt-dlp and ffmpeg are used"
type = "action"
label = "Show"
