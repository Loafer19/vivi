id = "subtitle-sync"
name = "Subtitle Auto-Sync"
version = "1.1.0"
description = "Aligns the current external subtitle to the audio with alass or ffsubsync in the background, then loads the synced copy saved next to the original. Manual offset keys (Alt+Z / Alt+X) are remembered per file. Uses an installed alass or ffsubsync; otherwise downloads alass on first use (3 MB on Linux x86_64, 26 MB on Windows) and, without a system ffmpeg, Vivi's media ffmpeg build (about 15 MB, shared with Chapter Thumbnails)."
author = "Vivi"
kind = "mpv-lua"
entry = "subtitle-sync.lua"
min_vivi = "0.9.0"
icon = "subtitles"
lucide = "captions"
permissions = ["network", "filesystem", "subprocess"]
size_note = "+ alass, ffmpeg if needed"
issue = 72
default_enabled = true

[[settings]]
key = "tool"
title = "Sync tool"
type = "choice"
options = ["Auto", "alass", "ffsubsync"]
default = "Auto"

[[settings]]
key = "download"
title = "Download alass when no sync tool is installed"
type = "toggle"
default = "true"

[[settings]]
key = "step"
title = "Offset step for Alt+Z / Alt+X in seconds (Alt+Shift: 10 steps)"
type = "choice"
options = ["0.1", "0.05", "0.25", "0.5"]
default = "0.1"

[[settings]]
key = "sync"
title = "Sync current subtitle (Alt+Y)"
type = "action"

[[settings]]
key = "reset"
title = "Reset the subtitle offset of this file (Alt+Backspace)"
type = "action"
label = "Reset"

[[settings]]
key = "detect"
title = "Which sync tool and ffmpeg are used"
type = "action"
label = "Show"
