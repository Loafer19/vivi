id = "youtube"
name = "YouTube & yt-dlp"
version = "1.2.0"
description = "Paste a video or playlist URL (or press Alt+U with one in the clipboard) to list its entries in the playlist, see the estimated size of each quality, and download video or audio only into a folder you choose, with progress toasts. Uses your system yt-dlp and ffmpeg when present; otherwise downloads and updates verified copies: yt-dlp (18–40 MB) from its official releases on first use, Vivi's own minimal static ffmpeg + ffprobe (about 6 MB) only for 1080p+ or audio conversion."
author = "Vivi"
kind = "mpv-lua"
entry = "youtube.lua"
min_vivi = "0.9.1"
icon = "streams"
lucide = "youtube"
permissions = ["network", "filesystem", "subprocess"]
default_enabled = true
size_note = "+ yt-dlp, ffmpeg if needed"

[[settings]]
key = "url"
title = "Video or playlist URL (Alt+U pastes from the clipboard)"
type = "text"
default = ""

[[settings]]
key = "add"
title = "List the entries in the playlist"
type = "action"
label = "Add to playlist"

[[settings]]
key = "quality"
title = "Download quality"
type = "choice"
options = ["Best available", "2160p", "1440p", "1080p", "720p", "480p", "360p"]
default = "1080p"

[[settings]]
key = "mode"
title = "Download"
type = "choice"
options = ["Video", "Audio only"]
default = "Video"

[[settings]]
key = "audio-format"
title = "Audio-only format (mp3/m4a/opus use ffmpeg, downloaded if missing)"
type = "choice"
options = ["Original", "mp3", "m4a", "opus"]
default = "Original"

[[settings]]
key = "sizes"
title = "Estimated size per quality"
type = "action"
label = "Show sizes"

[[settings]]
key = "folder"
title = "Download folder (empty: Downloads/Vivi)"
type = "text"
default = ""

[[settings]]
key = "pick-folder"
title = "Choose the download folder"
type = "action"
label = "Choose…"

[[settings]]
key = "download"
title = "Download the URL (or the playing video)"
type = "action"
label = "Download"

[[settings]]
key = "cancel"
title = "Stop the running download"
type = "action"
label = "Cancel"

[[settings]]
key = "source"
title = "yt-dlp to use"
type = "choice"
options = ["Auto (system if recent, else managed)", "System", "Managed copy"]
default = "Auto (system if recent, else managed)"

[[settings]]
key = "auto-update"
title = "Update the managed yt-dlp daily (and ffmpeg monthly)"
type = "toggle"
default = "true"

[[settings]]
key = "update"
title = "Update the managed yt-dlp now"
type = "action"
label = "Update"

[[settings]]
key = "update-ffmpeg"
title = "Update the managed ffmpeg (downloaded only for 1080p+ or audio conversion)"
type = "action"
label = "Update"

[[settings]]
key = "info"
title = "Which yt-dlp and ffmpeg are used"
type = "action"
label = "Show"
