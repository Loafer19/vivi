id = "acoustid"
name = "AcoustID Tagger"
version = "1.0.0"
description = "Identifies the playing song by its sound: fingerprints it with Chromaprint's fpcalc, looks it up on AcoustID and MusicBrainz and opens the Auto-tagger's before/after review with the tags and a new file name built from your pattern (for example {artist} - {title}), applied only when you confirm. Uses an installed fpcalc, otherwise downloads the official one (1.3–2.6 MB). Needs your free AcoustID application key."
author = "Vivi"
kind = "mpv-lua"
entry = "acoustid.lua"
min_vivi = "0.9.2"
icon = "tag"
lucide = "fingerprint"
permissions = ["network", "filesystem", "subprocess"]
size_note = "+ fpcalc if needed"
issue = 76
default_enabled = true

[[settings]]
key = "api-key"
title = "AcoustID application API key (free: acoustid.org/new-application)"
type = "secret"
default = ""

[[settings]]
key = "pattern"
title = "New file name: {artist} {title} {album} {albumartist} {year} {track} {genre}"
type = "text"
default = "{artist} - {title}"

[[settings]]
key = "download"
title = "Download fpcalc when it is not installed"
type = "toggle"
default = "true"

[[settings]]
key = "identify"
title = "Identify the playing file (Alt+I)"
type = "action"
label = "Identify"

[[settings]]
key = "detect"
title = "Which fpcalc is used"
type = "action"
label = "Show"
