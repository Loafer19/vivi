id = "scene-chapters"
name = "Scene Chapters & Thumbnails"
version = "1.0.0"
description = "Creates chapters at scene changes for videos without chapters (ffmpeg scene detection, in the background) and saves a thumbnail for every chapter. Results are cached on disk."
author = "Vivi"
kind = "mpv-lua"
entry = "scene-chapters.lua"
min_vivi = "0.8.0"
icon = "chapters"
lucide = "clapperboard"
permissions = ["filesystem", "subprocess"]
issue = 62
default_enabled = true

[[settings]]
key = "auto"
title = "Detect scenes automatically for videos without chapters"
type = "toggle"
default = "false"

[[settings]]
key = "threshold"
title = "Scene change threshold (0.1–0.9, lower = more chapters)"
type = "text"
default = "0.4"

[[settings]]
key = "min_gap"
title = "Minimum chapter length (seconds)"
type = "text"
default = "30"

[[settings]]
key = "thumbnails"
title = "Save chapter thumbnails"
type = "toggle"
default = "true"

[[settings]]
key = "detect"
title = "Detect scenes now (Alt+J)"
type = "action"

[[settings]]
key = "clear"
title = "Forget cached scenes for this file"
type = "action"
