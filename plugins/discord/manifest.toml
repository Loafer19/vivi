id = "discord"
name = "Discord Rich Presence"
version = "1.0.0"
description = "Shows the current title, artist and progress in your Discord status. Needs a Discord application ID; Discord must be running on this computer. Ships a small native helper (vivi-discord) that talks to Discord's local IPC."
author = "Vivi"
kind = "mpv-lua"
entry = "discord.lua"
min_vivi = "0.9.1"
icon = "discord"
lucide = "gamepad-2"
permissions = ["subprocess"]
issue = 57
default_enabled = false
binaries = ["vivi-discord"]

[[settings]]
key = "app-id"
title = "Discord application ID (create one at discord.com/developers/applications; its name is shown as \"Listening to <name>\")"
type = "text"
default = ""

[[settings]]
key = "hide-names"
title = "Hide titles and file names"
type = "toggle"
default = "false"

[[settings]]
key = "image"
title = "Large image key (optional art asset of your Discord application)"
type = "text"
default = ""

[[settings]]
key = "status"
title = "Connection status"
type = "action"
label = "Show"
