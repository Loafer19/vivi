# cargo-deny (run in CI: .github/workflows/ci.yml). `cargo deny check` locally.

[graph]
all-features = false

[advisories]
# RUSTSEC advisories (vulnerabilities, unsound and yanked crates) fail the check;
# "unmaintained" notices only for crates we depend on directly.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    # libmpv2 / libmpv2-sys (bindings to the LGPL libmpv, linked dynamically).
    "LGPL-2.1",
    # Slint, used under its royalty-free license.
    "LicenseRef-Slint-Royalty-free-2.0",
]
exceptions = []

[licenses.private]
# vivi itself (MIT, see LICENSE) is not published to crates.io.
ignore = true

[bans]
# Duplicate versions come from slint/winit/zbus transitive trees; report them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
