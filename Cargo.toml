[package]
name = "vivi"
version = "0.11.1"
edition = "2021"
description = "Fast, lightweight media player inspired by Juxtopposed's VLC redesign"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030", "accessibility"] }
libmpv2 = "4.1"
libmpv2-sys = "4.0"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", default-features = false }
lofty = "0.25.4"
md5 = "0.8.1"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
rustfft = "6"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
sha2 = "0.11.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rusty-chromaprint = "0.3.0"
# QR codes for plugin pairing dialogs (`script-message vivi-qr`); no image/svg features.
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Windows/macOS: compile SQLite in (no system library to link against).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# CI build check: release optimizations without fat LTO (release.yml / packaging keep it).
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
debug = 0
