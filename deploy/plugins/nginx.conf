server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/atom+xml;
    add_header X-Content-Type-Options nosniff always;
    # Catalog read by the app: always revalidate, allow cross-origin reads.
    location = /index.json { add_header Cache-Control "no-cache"; add_header Access-Control-Allow-Origin "*"; }
    location = /feed.xml { default_type application/atom+xml; add_header Cache-Control "public, max-age=600"; }
    location /img/ { add_header Cache-Control "public, max-age=604800"; }
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=3600"; }
    location / { try_files $uri $uri/ =404; }
}
