server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/x-shellscript;
    add_header X-Content-Type-Options nosniff always;
    location = /install.sh { default_type text/x-shellscript; add_header Cache-Control "no-cache"; }
    location /img/ { add_header Cache-Control "public, max-age=604800"; }
    location ~* \.css$ { add_header Cache-Control "public, max-age=86400"; }
    location /video/ { add_header Cache-Control "public, max-age=604800"; }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /index.html;
}
